name: Test formulas

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Find changed modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
      has_modules: ${{ steps.modules.outputs.has_modules }}

    steps:
      - name: Check out formulas
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.0
          cache: false

      - name: Find changed modules
        id: modules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          go install -tags=linknamefix -ldflags="-checklinkname=0" github.com/goplus/ixgo/cmd/ixgo@latest
          "$(go env GOPATH)/bin/ixgo" run .github/scripts/find_changed_modules.gsh

  test:
    name: ${{ matrix.module }} (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: changes
    if: needs.changes.outputs.has_modules == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # TODO: Expand this matrix with every formula option combination after
      # `llar test` can enumerate options instead of testing defaults only.
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
        platform:
          - linux-amd64
          - linux-arm64
          - darwin-amd64
          - darwin-arm64
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - platform: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - platform: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64

    steps:
      - name: Check out formulas
        uses: actions/checkout@v7

      - name: Check out llar
        uses: actions/checkout@v7
        with:
          repository: goplus/llar
          ref: main
          path: .llar-source

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential ca-certificates cmake curl gperf groff patch

      - name: Install LLVM 19 on Linux
        if: runner.os == 'Linux'
        run: |
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            --output "$RUNNER_TEMP/apt.llvm.org.asc"
          sudo install -m 644 "$RUNNER_TEMP/apt.llvm.org.asc" /usr/share/keyrings/apt.llvm.org.asc
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" \
            | sudo tee /etc/apt/sources.list.d/llvm19.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 lld-19 llvm-19
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake gperf groff llvm@19 lld@19
          echo "$(brew --prefix llvm@19)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld@19)/bin" >> "$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .llar-source/go.mod
          cache: false

      - name: Verify runner platform
        shell: bash
        run: |
          test "$(go env GOOS)" = "${{ matrix.goos }}"
          test "$(go env GOARCH)" = "${{ matrix.goarch }}"

      - name: Install llar
        working-directory: .llar-source
        run: |
          go install -ldflags="-checklinkname=0" ./cmd/llar
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # TODO: Add version-range support to `llar test`.
      # For example, test a changed formula from `fromVer "1.0.0"` instead of the latest source tag.
      - name: Test module
        run: llar test --verbose "./${{ matrix.module }}" --os "${{ matrix.goos }}" --arch "${{ matrix.goarch }}"

      - name: Prepare llcppg input
        shell: bash
        env:
          PROJECT: ${{ matrix.module }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          input_dir="$RUNNER_TEMP/llcppg/source"
          mkdir -p "$input_dir/include"
          # Keep this checkout's local Formula overlay; llar install uses LLAR Cloud.
          llar make --json "./$PROJECT" --os "$TARGET_OS" --arch "$TARGET_ARCH" > "$RUNNER_TEMP/llcppg/install.json"
          install_dir="$(jq -r '.dir' "$RUNNER_TEMP/llcppg/install.json")"
          cp -R "$GITHUB_WORKSPACE/$PROJECT/." "$input_dir/"
          cp -R "$install_dir/include/." "$input_dir/include/"

      - name: Check out llcppg
        uses: actions/checkout@v7
        with:
          repository: goplus/llcppg
          ref: v0.11.0
          path: .llcppg-source
          persist-credentials: false

      - name: Set up Go for llcppg
        uses: actions/setup-go@v7
        with:
          go-version-file: .llcppg-source/go.mod
          cache: false

      - name: Install LLVM 21 and LLGo dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            llvm-21-dev clang-21 libclang-21-dev lld-21 libunwind-21-dev libc++-21-dev \
            pkg-config libgc-dev libssl-dev zlib1g-dev libffi-dev libuv1-dev
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"

      - name: Install LLVM 21 and LLGo dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21 lld@21 bdw-gc openssl libffi libuv pkg-config
          echo "$(brew --prefix llvm@21)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld@21)/bin" >> "$GITHUB_PATH"

      - name: Check out LLGo
        uses: actions/checkout@v7
        with:
          repository: xgo-dev/llgo
          ref: afe9a5407260348b18c7104e98d76cb5cdf48b29
          path: .llgo-source
          persist-credentials: false

      - name: Build LLGo with LLVM 21
        working-directory: .llgo-source
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/llcppg-bin
          GOFLAGS: -tags=dev,byollvm,llvm21
          GOTOOLCHAIN: local
        run: |
          llvm-config --version
          export CGO_CPPFLAGS="$(llvm-config --cppflags)"
          export CGO_CXXFLAGS="$(llvm-config --cxxflags)"
          export CGO_LDFLAGS="$(llvm-config --ldflags --libs --system-libs)"
          ./install.sh
          "$GOBIN/llgo" version
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Build llcppg
        working-directory: .llcppg-source
        run: llgo build -o "$RUNNER_TEMP/llcppg-bin/llcppg" ./cmd/llcppg

      - name: Test llcppg generation
        shell: bash
        working-directory: ${{ runner.temp }}/llcppg/source
        env:
          PROJECT: ${{ matrix.module }}
        run: |
          go mod init "github.com/llarhub/$PROJECT/c"
          go mod edit -go=1.23 -require=github.com/goplus/lib@v0.6.1
          go mod download github.com/goplus/lib@v0.6.1
          llcppg -v "$RUNNER_TEMP/llcppg/generated" "$PWD"
          ls "$RUNNER_TEMP/llcppg/generated"/*.go
